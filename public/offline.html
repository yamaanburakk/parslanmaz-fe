<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çevrimdışı - Pars Endüstriyel Mutfak</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #131C3C 0%, #1A2647 50%, #223052 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
        }
        
        .logo {
            width: 200px;
            height: auto;
            margin: 0 auto 40px;
            display: block;
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #66B2FF, #FF6B35, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .retry-btn {
            background: linear-gradient(45deg, #66B2FF, #4E9EFF);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 178, 255, 0.3);
        }
        
        .status {
            margin-top: 30px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
        
        .wifi-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            opacity: 0.6;
        }
        
        @media (max-width: 640px) {
            h1 {
                font-size: 2rem;
            }
            
            p {
                font-size: 1rem;
            }
            
            .logo {
                width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="wifi-icon" fill="currentColor" viewBox="0 0 24 24">
            <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.07 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>
        </svg>
        
        <h1>Çevrimdışısınız</h1>
        
        <p>
            İnternet bağlantınızı kontrol edin ve tekrar deneyin. 
            Sayfamızın bazı özellikleri çevrimdışı kullanılabilir.
        </p>
        
        <a href="/" class="retry-btn" onclick="window.location.reload()">
            Tekrar Dene
        </a>
        
        <div class="status">
            Pars Endüstriyel Mutfak - Çevrimdışı Mod
        </div>
    </div>
    
    <script>
        // Check for online status
        function updateOnlineStatus() {
            if (navigator.onLine) {
                window.location.href = '/';
            }
        }
        
        window.addEventListener('online', updateOnlineStatus);
        
        // Auto-retry every 30 seconds
        setInterval(updateOnlineStatus, 30000);
    </script>
</body>
</html>
